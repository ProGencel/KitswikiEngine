plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.progencel'
version = '1.0.0'

sourceCompatibility = 17
targetCompatibility = 17

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "com.badlogicgames.gdx:gdx:1.14.2"
}

java {
    withSourcesJar()
}

publishing {
    publications {
        release(MavenPublication) {
            from components.java
        }
    }
}